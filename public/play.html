:root{--navy:#101B33;--navy2:#0A1122;--navy3:#172443;--line:rgba(244,242,236,.14);--cream:#FCFBF8;--paper:#F4F2EC;--ink:#101B33;--muted:#566072;--mutedL:#A9B3C7;
 --gold:#D2A445;--goldL:#E8C77A;--ok:#1B7650;--okL:#63C795;--acc:#8E5E08;--accL:#E2B85A;--err:#A8362B;--errL:#EC7B70;
 --hd:'Bricolage Grotesque','Trebuchet MS',sans-serif;--bd:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--paper);font-family:var(--bd);-webkit-font-smoothing:antialiased}
body{padding:0 0 calc(28px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:rgba(16,27,51,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:10px}
.brand b{display:block;font:800 18px var(--hd);letter-spacing:-.2px}
.brand span{font:700 10px var(--bd);letter-spacing:2px;text-transform:uppercase;color:var(--mutedL)}
.sp{flex:1}
.tpill{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 10px;border-radius:999px;background:var(--navy3);box-shadow:inset 0 0 0 2px var(--tc,var(--line));font:700 14px var(--bd);max-width:58vw}
.tpill i{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.tpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpill b{font:800 17px var(--hd);color:var(--tc)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mutedL);flex:none}
.dot.ok{background:var(--okL)}.dot.bad{background:var(--errL)}
main{padding-top:18px}
.eyebrow{font:700 12px var(--bd);letter-spacing:2.4px;text-transform:uppercase;color:var(--gold)}
h1{font:800 34px/1.02 var(--hd);letter-spacing:-.8px;margin:8px 0 10px}
h2{font:800 26px/1.08 var(--hd);letter-spacing:-.4px;margin:6px 0 6px}
p{line-height:1.45}
.muted{color:var(--mutedL)}
.card{background:var(--cream);color:var(--ink);border-radius:22px;padding:20px}
.field{display:flex;gap:8px;margin-top:16px}
.field input{flex:1;min-width:0;height:58px;border-radius:16px;border:0;background:var(--cream);color:var(--ink);padding:0 18px;font:800 26px var(--hd);letter-spacing:6px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 22px;border-radius:16px;background:var(--gold);color:var(--navy);font:700 18px var(--bd)}
.btn.block{width:100%}
.teams{display:grid;gap:10px;margin-top:16px}
.team{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 18px;border-radius:18px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);text-align:left;font:700 19px var(--bd)}
.team i{width:18px;height:18px;border-radius:50%;background:var(--tc);flex:none}
.team:active{box-shadow:inset 0 0 0 2px var(--tc)}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 5px;border-radius:999px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);font:700 13px var(--bd)}
.chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:#fff;font:800 11px var(--hd);font-style:normal}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta .count{font:600 13px var(--bd);color:var(--mutedL)}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:14px 0 4px}
.tbar div{height:100%;background:var(--gold);border-radius:4px;transition:width .3s linear}
.tbar.warn div{background:var(--errL)}
.ttxt{display:flex;justify-content:space-between;font:600 13px var(--bd);color:var(--mutedL)}
.ttxt b{color:var(--paper);font:800 15px var(--hd)}
.emp{font:800 26px/1.08 var(--hd);margin:16px 0 2px;letter-spacing:-.4px}
.sector{font:500 14px var(--bd);color:var(--bl)}
details{margin:12px 0 0;border-radius:16px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line)}
summary{list-style:none;padding:14px 16px;font:700 15px var(--bd);display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font:600 22px var(--bd);color:var(--gold)}
details[open] summary::after{content:'−'}
details .in{padding:0 16px 14px;font:400 16px/1.48 var(--bd)}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.dato{padding:10px 12px;border-radius:12px;background:rgba(244,242,236,.06)}
.dato small{display:block;font:700 10px var(--bd);letter-spacing:1.2px;text-transform:uppercase;color:var(--mutedL);margin-bottom:3px}
.dato b{font:700 15px/1.2 var(--bd)}
.q{margin:18px 0 12px;font:800 21px/1.18 var(--hd);color:var(--goldL);padding-left:12px;border-left:5px solid var(--gold)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start;text-align:left;padding:14px;border-radius:18px;background:var(--cream);color:var(--ink);box-shadow:0 0 0 0 transparent;transition:box-shadow .15s,transform .1s,opacity .2s}
.opt:active{transform:scale(.985)}
.opt .l{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--bc);color:#fff;font:800 24px var(--hd)}
.opt .t{font:800 18px/1.15 var(--hd);margin-top:2px}
.opt .d{font:500 14px/1.35 var(--bd);color:var(--muted);margin-top:4px}
.opt.sel{box-shadow:0 0 0 4px var(--tc),0 10px 30px rgba(0,0,0,.35)}
.opt.sel .l{background:var(--tc);color:var(--navy)}
.opts.closed .opt:not(.sel){opacity:.45}
.opt.r-ok{box-shadow:0 0 0 4px var(--okL)}.opt.r-acc{box-shadow:0 0 0 4px var(--accL)}.opt.r-err{opacity:.4}
.status{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line),0 12px 30px rgba(0,0,0,.4);font:600 15px/1.4 var(--bd)}
.status.ok{box-shadow:inset 0 0 0 2px var(--tc),0 12px 30px rgba(0,0,0,.4)}
.status b{color:var(--tc)}
.res{border-radius:24px;padding:22px 20px;text-align:center;margin-top:6px}
.res.ok{background:var(--ok)}.res.acc{background:var(--acc)}.res.err{background:var(--err)}.res.none{background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line)}
.res small{font:700 12px var(--bd);letter-spacing:2.4px;text-transform:uppercase;opacity:.9}
.res .pts{font:800 64px/1 var(--hd);margin:6px 0 4px}
.res p{margin:0;font:600 16px var(--bd)}
.best{margin-top:16px}
.best .bl{display:flex;align-items:center;gap:12px;margin:8px 0 10px}
.best .bl i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ok);color:#fff;font:800 22px var(--hd);font-style:normal;flex:none}
.best .bl b{font:800 22px/1.1 var(--hd)}
.key{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--cream);color:var(--ink);font:700 16px/1.38 var(--bd)}
.key small{display:block;font:700 11px var(--bd);letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.wait{text-align:center;padding:40px 10px}
.pulse{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:var(--tc,var(--gold));opacity:.9;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1);opacity:1}}
.rank{display:grid;gap:8px;margin-top:14px}
.rk{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);font:700 16px var(--bd)}
.rk.me{box-shadow:inset 0 0 0 2px var(--tc)}
.rk>b{font:800 18px var(--hd);color:var(--mutedL)}
.rk em{font:800 20px var(--hd);font-style:normal;color:var(--tc)}
.link{display:block;margin:26px auto 0;font:600 14px var(--bd);color:var(--mutedL);text-decoration:underline;text-underline-offset:3px}
.err{margin-top:12px;color:var(--errL);font:600 15px var(--bd)}
.fade{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="brand"><b>Decide la estrategia</b><span>ECOTEC · MBA</span></div><span class="sp"></span><span id="pill"></span><span class="dot" id="dot"></span></div></div>
<main class="wrap" id="app"></main>
<script>
(function(){
'use strict';
const app=document.getElementById('app'),pill=document.getElementById('pill'),dot=document.getElementById('dot');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let device=ls.get('de.device');if(!device){device=Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>x.toString(16).padStart(2,'0')).join('');ls.set('de.device',device)}
const P=new URLSearchParams(location.search);
let code=(P.get('c')||ls.get('de.code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
let team=null,state=null,teamVote=null,offset=0,lastV=null,lastRevealKey=null,pending=null,pendingAt=0,errMsg='',polling=false,timerId=0;
function loadTeam(){const t=ls.get('de.team.'+code);team=t===null||t===''?null:+t}
if(code)loadTeam();

async function api(path,opts){const r=await fetch('/api'+path,Object.assign({cache:'no-store'},opts||{}));let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||'http');e.status=r.status;throw e}return j}
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
function mark(ok){dot.className='dot '+(ok?'ok':'bad')}

/* ── pantalla: código ── */
function rCode(msg){pill.innerHTML='';app.innerHTML=`<div class="fade"><div class="eyebrow" style="margin-top:20px">MBA · Decisiones Estratégicas y Marketing</div><h1>Entra a la sala</h1>
 <p class="muted">Escribe el código que aparece en la pantalla del profesor.</p>
 <form class="field" id="f"><input id="ci" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="CÓDIGO" value="${esc(code)}"><button class="btn">Entrar</button></form>
 ${msg?`<div class="err">${esc(msg)}</div>`:''}</div>`;
 document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=document.getElementById('ci').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v)return;code=v;ls.set('de.code',code);history.replaceState(null,'','?c='+code);loadTeam();lastV=null;poll(true)}}

/* ── pantalla: equipo ── */
function rTeam(){pill.innerHTML='';app.innerHTML=`<div class="fade"><div class="eyebrow" style="margin-top:14px">Sala ${esc(code)}</div><h1>¿Cuál es tu equipo?</h1>
 <p class="muted">Pueden entrar varios celulares por equipo. Cuenta el último voto que envíe cualquiera de ustedes.</p>
 <div class="teams">${(state.teams||[]).map((t,k)=>`<button class="team" data-k="${k}" style="--tc:${t.c}"><i></i>${esc(t.name)}</button>`).join('')}</div></div>`;
 app.querySelectorAll('.team').forEach(b=>b.onclick=async()=>{team=+b.dataset.k;ls.set('de.team.'+code,team);ls.set('de.code',code);lastV=null;
  try{await post('/join',{code,team,device})}catch(e){}poll(true)})}

function myTeam(){return state&&state.teams&&team!=null?state.teams[team]:null}
function rankOf(){const tot=state.totals||[];const arr=(state.teams||[]).map((t,k)=>({...t,k,s:tot[k]||0})).sort((a,b)=>b.s-a.s);let r=0;arr.forEach((o,i)=>{if(i===0||o.s<arr[i-1].s)r=i+1;o.r=r});return arr}
function renderPill(){const t=myTeam();if(!t){pill.innerHTML='';return}const s=(state.totals||[])[team]||0;
 pill.innerHTML=`<button class="tpill" id="tp" style="--tc:${t.c}"><i></i><span>${esc(t.name)}</span><b>${s}</b></button>`}

/* ── pantalla: espera ── */
function rWait(){const t=myTeam(),b=state.block;
 app.innerHTML=`<div class="wait fade" style="--tc:${t.c}"><div class="pulse"></div>
 ${state.phase==='intro'&&b?`<div class="eyebrow">Próximo bloque</div><h1 style="color:${b.l}">${esc(b.n)} · ${esc(b.name)}</h1><p class="muted">${esc(b.sub||'')}. Miren la pantalla: el profesor repasa el concepto antes de empezar.</p>`
  :`<div class="eyebrow">¡Listo!</div><h1>Estás en ${esc(t.name)}</h1><p class="muted">Espera a que el profesor inicie el juego. Esta pantalla cambiará sola.</p>`}
 <button class="link" id="chg">Cambiar de equipo</button></div>`;
 document.getElementById('chg').onclick=changeTeam}
function changeTeam(){ls.del('de.team.'+code);team=null;rTeam()}

/* ── pantalla: caso ── */
function remaining(){if(!state.endsAt)return state.timed?(state.running?null:state.remaining):null;return Math.max(0,(state.endsAt-(Date.now()+offset))/1000)}
function closed(){if(state.revealed)return true;if(!state.timed)return false;const r=remaining();return r!==null&&r<=0}
function curVote(){return pending&&Date.now()-pendingAt<4000?pending:teamVote}
function rCase(){const t=myTeam(),b=state.block||{},v=curVote(),cl=closed();
 app.innerHTML=`<div class="fade" style="--tc:${t.c};--bc:${b.c};--bl:${b.l}">
  <div class="meta"><span class="chip"><i>${esc(b.n)}</i>${esc(b.name)}</span><span class="count">Caso ${state.i+1} / ${state.n}</span></div>
  ${state.timed?`<div class="tbar" id="tb"><div></div></div><div class="ttxt"><span id="tl">Tiempo</span><b id="tv"></b></div>`:''}
  <div class="emp">${esc(state.e)}</div><div class="sector">${esc(state.s)}</div>
  <details><summary>Ver planteamiento y datos</summary><div class="in">${esc(state.sit)}<div class="datos">${(state.dat||[]).map(d=>`<div class="dato"><small>${esc(d[0])}</small><b>${esc(d[1])}</b></div>`).join('')}</div></div></details>
  <div class="q">${esc(state.q)}</div>
  <div class="opts ${cl?'closed':''}" id="opts">${(state.opts||[]).map(o=>`<button class="opt ${v===o.id?'sel':''}" data-id="${o.id}"><span class="l">${o.L}</span><span><div class="t">${esc(o.t)}</div><div class="d">${esc(o.d)}</div></span></button>`).join('')}</div>
  <div class="status ${v?'ok':''}" id="st"></div></div>`;
 app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>vote(el.dataset.id));
 paintStatus();tickTimer()}
function paintStatus(){const st=document.getElementById('st');if(!st)return;const v=curVote(),o=(state.opts||[]).find(x=>x.id===v),cl=closed();
 st.className='status '+(v?'ok':'');
 st.innerHTML=errMsg?`<span style="color:var(--errL)">${esc(errMsg)}</span>`:cl?(o?`Tiempo terminado. Voto del equipo: <b>${o.L} · ${esc(o.t)}</b>`:'Tiempo terminado. Tu equipo no votó.'):o?`Voto del equipo: <b>${o.L} · ${esc(o.t)}</b><br><span class="muted" style="font-size:13px">Pueden cambiarlo hasta que termine el tiempo.</span>`:'Toca una opción para votar por tu equipo.';
 app.querySelectorAll('.opt').forEach(el=>el.classList.toggle('sel',el.dataset.id===v));const os=document.getElementById('opts');if(os)os.classList.toggle('closed',cl)}
async function vote(id){if(closed())return;errMsg='';pending=id;pendingAt=Date.now();paintStatus();if(navigator.vibrate)navigator.vibrate(15);
 try{const r=await post('/vote',{code,team,i:state.i,opt:id,device});teamVote=r.teamVote;pending=null;mark(true)}
 catch(e){pending=null;errMsg=e.message==='closed'?'La votación de este caso ya se cerró.':'No se pudo enviar el voto. Revisa tu conexión e intenta de nuevo.';mark(e.status?true:false)}
 paintStatus()}
function tickTimer(){const tb=document.getElementById('tb');if(!tb)return;const r=remaining();const tot=state.timedTotal||null;
 let left=r===null?state.remaining:r;if(left==null)left=0;const tv=document.getElementById('tv'),tl=document.getElementById('tl');
 tv.textContent=Math.ceil(left)+' s';tl.textContent=state.running?'Tiempo restante':(left>0?'En pausa':'¡Tiempo!');
 const base=state.total||state.base||Math.max(left,1);tb.firstChild.style.width=Math.min(100,left/base*100)+'%';tb.classList.toggle('warn',left<=10)}

/* ── pantalla: revelado ── */
function rReveal(){const t=myTeam(),b=state.block||{},sc=state.sc||{},v=teamVote,p=v?(sc[v]||0):null;
 const best=(state.opts||[]).find(o=>sc[o.id]===100),mine=(state.opts||[]).find(o=>o.id===v);
 const cls=p===100?'ok':p===40?'acc':p===0?'err':'none';
 app.innerHTML=`<div class="fade" style="--tc:${t.c};--bc:${b.c}">
  <div class="meta"><span class="chip"><i>${esc(b.n)}</i>${esc(b.name)}</span><span class="count">Caso ${state.i+1} / ${state.n}</span></div>
  <div class="res ${cls}" style="margin-top:14px"><small>${p===100?'Decisión óptima':p===40?'Decisión aceptable':p===0?'Decisión errónea':'Sin voto'}</small>
   <div class="pts">${p===null?'0':'+'+p}</div><p>${mine?`Votaron ${mine.L} · ${esc(mine.t)}`:'Tu equipo no votó en este caso'}</p></div>
  <div class="best"><div class="eyebrow" style="color:var(--okL)">La decisión óptima</div><div class="bl"><i>${best?best.L:''}</i><b>${best?esc(best.t):''}</b></div>
  <p style="margin:0">${esc(state.why||'')}</p>
  ${mine&&best&&mine.id!==best.id&&state.n2&&state.n2[mine.id]?`<p class="muted" style="margin-top:10px"><b style="color:var(--paper)">Sobre su opción:</b> ${esc(state.n2[mine.id])}</p>`:''}
  <div class="key"><small>Concepto clave</small>${esc(state.key||'')}</div></div>
  <p class="muted" style="text-align:center;margin-top:18px">Puntaje del equipo: <b style="color:var(--tc)">${(state.totals||[])[team]||0}</b> · Siguiente caso en la pantalla</p></div>`;
 const k=state.i+':'+code;if(lastRevealKey!==k){lastRevealKey=k;if(navigator.vibrate)navigator.vibrate(p===100?[40,60,40]:30)}}

/* ── pantalla: final ── */
function rFinal(){const t=myTeam(),arr=rankOf(),me=arr.find(o=>o.k===team);
 app.innerHTML=`<div class="fade" style="--tc:${t.c}"><div class="eyebrow" style="margin-top:10px">Resultados finales</div>
  <h1>${me?`${me.r}.º lugar`:'Fin del juego'}</h1><p class="muted">${esc(t.name)} terminó con <b style="color:var(--tc)">${me?me.s:0}</b> puntos.</p>
  <div class="rank">${arr.map(o=>`<div class="rk ${o.k===team?'me':''}" style="--tc:${o.c}"><b>${o.r}</b><span>${esc(o.name)}</span><em>${o.s}</em></div>`).join('')}</div></div>`}

/* ── ciclo ── */
function render(){if(!state)return;if(team==null||!myTeam())return rTeam();renderPill();
 if(state.phase==='case')return state.revealed?rReveal():rCase();
 if(state.phase==='final')return rFinal();
 return rWait()}
async function poll(force){if(!code){rCode();return}if(polling&&!force)return;polling=true;
 try{const q=new URLSearchParams({code});if(team!=null)q.set('team',team);const r=await api('/state?'+q);mark(true);
  offset=r.serverNow-Date.now();const prevI=state&&state.i,prevPhase=state&&state.phase,prevRev=state&&state.revealed;
  const ns=r.state;if(state&&ns.phase==='case'&&prevPhase==='case'&&prevI===ns.i&&state.base)ns.base=state.base;
  if(ns.phase==='case'&&!ns.base)ns.base=ns.remaining||null;
  if(!state||ns.i!==prevI||ns.phase!==prevPhase)errMsg='';
  state=ns;teamVote=r.teamVote;
  if(state.v!==lastV||force){lastV=state.v;render()}else if(state.phase==='case'&&!state.revealed){paintStatus();tickTimer();renderPill()}
 }catch(e){mark(false);if(e.status===404){ls.del('de.code');state=null;rCode('No encontramos esa sala. Revisa el código en la pantalla.')}}
 finally{polling=false}}
setInterval(()=>{if(!document.hidden)poll()},2000);
setInterval(()=>{if(state&&state.phase==='case'&&!state.revealed){tickTimer();if(closed())paintStatus()}},500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll(true)});
pill.addEventListener('click',e=>{if(e.target.closest('#tp')&&state&&state.phase!=='case')changeTeam()});
if(code)poll(true);else rCode();
})();
</script>
</body>
</html>
