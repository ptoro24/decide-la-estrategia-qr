:root{
 --navy:#101B33;--navy2:#0A1122;--navy3:#172443;--navy4:#1E2D52;
 --line:rgba(244,242,236,.14);--cream:#FCFBF8;--paper:#F4F2EC;--sand:#DFDACE;--ink:#101B33;
 --muted:#566072;--mutedL:#A9B3C7;--gold:#D2A445;--goldL:#E8C77A;
 --ok:#1B7650;--okL:#63C795;--acc:#8E5E08;--accL:#E2B85A;--err:#A8362B;--errL:#EC7B70;
 --hd:'Bricolage Grotesque','Trebuchet MS',sans-serif;--bd:'DM Sans',Verdana,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy2);overflow:hidden;font-family:var(--bd);color:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit}
#app{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;
 background:radial-gradient(1200px 700px at 85% -10%,#1A2A50 0%,rgba(26,42,80,0) 60%),var(--navy);box-shadow:0 20px 80px rgba(0,0,0,.45)}
#view{position:absolute;inset:0}
.fade{animation:fd .45s ease both}
@keyframes fd{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
#bar{position:absolute;left:0;top:0;height:6px;background:linear-gradient(90deg,var(--gold),var(--goldL));transition:width .6s ease;z-index:5}
.eyebrow{font:700 18px/1 var(--bd);letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.h1{font:800 124px/.92 var(--hd);letter-spacing:-3px;margin:0}
.h2{font:800 64px/1 var(--hd);letter-spacing:-1.5px;margin:0}
.btn{display:inline-flex;align-items:center;gap:14px;height:72px;padding:0 38px;border-radius:999px;background:var(--gold);color:var(--navy);font:700 26px var(--bd);transition:filter .2s,translate .2s}
.btn:hover{filter:brightness(1.08);translate:0 -2px}
.btn:disabled{opacity:.35;cursor:not-allowed;translate:none}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{height:54px;padding:0 26px;font-size:21px}
.btn svg{width:26px;height:26px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 20px;border-radius:999px;background:var(--navy3);color:var(--paper);font:600 19px var(--bd);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.ib:hover{background:var(--navy4)}
.ib svg{width:24px;height:24px;flex:none}
.ib.on{background:var(--gold);color:var(--navy)}

/* ── SETUP ── */
.setup{position:absolute;inset:0;display:grid;grid-template-columns:780px 1fr;gap:72px;padding:70px 80px 64px 96px}
.hero{display:flex;flex-direction:column}
.hero .uni{display:flex;align-items:center;gap:18px;margin-bottom:56px}
.hero .uni b{font:800 30px var(--hd);letter-spacing:1px;color:var(--paper)}
.hero .uni span{height:30px;width:2px;background:var(--line)}
.hero .uni i{font:500 20px var(--bd);font-style:normal;color:var(--mutedL);line-height:1.25}
.hero .h1 em{font-style:normal;color:var(--gold)}
.hero .lead{font:400 30px/1.4 var(--bd);color:var(--mutedL);margin:30px 0 44px;max-width:660px}
.steps{display:grid;gap:18px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:20px;align-items:flex-start;font:500 24px/1.35 var(--bd);color:var(--paper)}
.steps li b{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--navy3);box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold);font:800 21px var(--hd)}
.steps .pts{display:inline-flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.hero .prof{margin-top:auto;font:500 21px var(--bd);color:var(--mutedL)}
.hero .prof b{color:var(--paper);font-weight:700}
.cfg{background:var(--cream);color:var(--ink);border-radius:36px;padding:36px 46px 30px;display:flex;flex-direction:column;gap:20px;box-shadow:0 40px 120px rgba(0,0,0,.35);border-top:10px solid var(--gold)}

.cfg .row3{display:grid;grid-template-columns:auto auto auto;gap:30px;justify-content:start}
.stepper{display:flex;align-items:center;gap:16px}
.stepper button{width:52px;height:52px;border-radius:50%;background:#EBE8DF;font:700 30px var(--bd);color:var(--ink)}
.stepper b{font:800 44px var(--hd);min-width:40px;text-align:center}
.names{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.names label{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:14px;background:#F1EEE6;box-shadow:inset 0 0 0 1px var(--sand)}
.names label i{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(16,27,51,.25)}
.names input{width:100%;border:0;background:transparent;font:600 19px var(--bd);color:var(--ink);outline:none}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bk{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:16px;background:#F1EEE6;text-align:left;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s,background .2s}
.bk .bn{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--hd);color:#fff;background:var(--bc);opacity:.35}
.bk .bt{font:700 18px/1.15 var(--bd);color:var(--muted)}
.bk.on{background:#fff;box-shadow:inset 0 0 0 2px var(--bc)}
.bk.on .bn{opacity:1}.bk.on .bt{color:var(--ink)}
.seg{display:inline-flex;padding:5px;border-radius:999px;background:#EBE8DF;gap:4px}
.seg button{height:44px;padding:0 20px;border-radius:999px;font:600 19px var(--bd);color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--paper)}
.mini{font:600 17px var(--bd);color:var(--muted);text-decoration:underline;text-underline-offset:4px;margin-left:14px}
.cfg .go{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:18px;border-top:2px solid #E6E1D6}
.cfg .go .sum{font:500 22px var(--bd);color:var(--muted)}
.cfg .go .sum b{color:var(--ink);font:800 30px var(--hd)}
.resume{display:flex;align-items:center;gap:18px;padding:10px 12px 10px 22px;border-radius:18px;background:var(--navy);color:var(--paper);font:500 20px var(--bd)}
.resume b{color:var(--gold)}
.resume .btn{margin-left:auto}

/* ── HEADER ── */
.hdr{position:absolute;left:64px;right:64px;top:26px;height:72px;display:flex;align-items:center;gap:22px}
.brand{display:flex;flex-direction:column;gap:6px;margin-right:10px}
.brand b{font:800 26px var(--hd);letter-spacing:-.3px}
.brand span{font:700 13px var(--bd);letter-spacing:2.5px;color:var(--mutedL);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:12px;height:50px;padding:0 22px 0 8px;border-radius:999px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);font:700 20px var(--bd)}
.chip i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:#fff;font:800 15px var(--hd);font-style:normal}
.count{font:600 20px var(--bd);color:var(--mutedL)}
.count b{color:var(--paper);font:800 26px var(--hd)}
.hdr .sp{flex:1}
.timer{position:relative;width:72px;height:72px;cursor:pointer}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}
.timer .tb{stroke:var(--line)}
.timer .tf{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font:800 23px var(--hd)}
.timer.warn .tf{stroke:var(--errL)}
.timer.out{animation:pulse 1s infinite}
.timer.paused span{color:var(--mutedL)}
.timer.off{display:none}
@keyframes pulse{50%{scale:1.1}}

/* ── CASE ── */
.left{position:absolute;left:64px;top:122px;width:800px;bottom:204px;display:flex;flex-direction:column}
.right{position:absolute;left:904px;right:64px;top:122px;bottom:204px;display:flex;flex-direction:column}
.origin{display:flex;align-items:center;gap:12px;font:700 16px var(--bd);letter-spacing:2px;text-transform:uppercase;color:var(--mutedL)}
.origin .tag{padding:6px 12px;border-radius:8px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);color:var(--paper)}
.emp{font:800 54px/1.02 var(--hd);letter-spacing:-1.2px;margin:16px 0 6px}
.sector{font:500 23px var(--bd);color:var(--bl)}
.sit{font:400 27px/1.45 var(--bd);color:var(--paper);margin:22px 0 22px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dato{padding:14px 18px;border-radius:16px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line)}
.dato small{display:block;font:700 14px var(--bd);letter-spacing:1.6px;text-transform:uppercase;color:var(--mutedL);margin-bottom:6px}
.dato b{font:700 25px/1.15 var(--bd);color:var(--paper)}
.qq{margin-top:auto;padding-top:18px;display:flex;gap:16px;align-items:flex-start}
.qq i{flex:none;width:8px;align-self:stretch;border-radius:4px;background:var(--gold)}
.qq p{margin:0;font:800 33px/1.15 var(--hd);color:var(--goldL);letter-spacing:-.4px}
.hint{display:none;margin-top:14px;padding:14px 20px;border-radius:14px;background:rgba(210,164,69,.12);box-shadow:inset 0 0 0 1px rgba(210,164,69,.4);font:500 22px/1.35 var(--bd);color:var(--goldL)}
.hint.show{display:block;animation:fd .35s ease both}
.hint b{font-weight:800}
.dtitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.dtitle span{font:700 16px var(--bd);letter-spacing:2.5px;text-transform:uppercase;color:var(--mutedL)}
.dtitle em{font:500 18px var(--bd);font-style:normal;color:var(--mutedL);white-space:nowrap}
.dia{flex:1;position:relative;min-height:0}

/* option card */
.opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:20px 22px 18px 22px;border-radius:22px;background:var(--cream);color:var(--ink);
 box-shadow:0 0 0 4px transparent,0 14px 36px rgba(0,0,0,.25);transition:box-shadow .3s,opacity .4s,translate .3s,filter .3s;min-height:0;overflow:hidden}
button.opt:hover{translate:0 -3px}
.opt .ol{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--bc);color:#fff;font:800 25px var(--hd);flex:none}
.opt .oh{display:flex;align-items:center;gap:14px;width:100%}
.opt .ot{font:800 27px/1.08 var(--hd);letter-spacing:-.4px}
.opt .od{font:500 19px/1.32 var(--bd);color:var(--muted);margin-top:10px}
.opt .or{margin-left:auto;font:700 14px var(--bd);letter-spacing:1.5px;text-transform:uppercase;color:var(--bc);white-space:nowrap}
.opt>*{flex:none}
.opt .ov{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px;min-height:44px;max-width:calc(100% - 150px)}
.bell .opt .ov,.curve .opt .ov{max-width:100%;padding-bottom:30px}
.vd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--hd);color:var(--navy);background:var(--tc);box-shadow:0 0 0 3px var(--cream);animation:pop .3s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{scale:0}to{scale:1}}
.opt .rb{position:absolute;bottom:0;right:0;padding:10px 16px 10px 18px;border-top-left-radius:18px;white-space:nowrap;font:800 16px var(--bd);letter-spacing:1.5px;color:#fff;display:none}
.opt.r-ok{box-shadow:0 0 0 6px var(--okL),0 20px 50px rgba(0,0,0,.35);z-index:2}
.opt.r-ok .rb{display:block;background:var(--ok)}
.opt.r-acc{box-shadow:0 0 0 5px var(--accL),0 14px 36px rgba(0,0,0,.25)}
.opt.r-acc .rb{display:block;background:var(--acc)}
.opt.r-err{opacity:.42;filter:saturate(.4)}
.opt.r-err .rb{display:block;background:var(--err)}
.opt.r-ok,.opt.r-acc{animation:hl .6s ease both}
@keyframes hl{0%{scale:.96}60%{scale:1.03}100%{scale:1}}
.static .opt{box-shadow:0 10px 30px rgba(0,0,0,.2)}
.static .opt .ov{display:none}

/* layouts */
.mx{position:absolute;inset:0;display:grid;grid-template-columns:52px 1fr;grid-template-rows:48px 1fr;gap:10px}
.mx .cl{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end}
.mx .cl span,.mx .rl span{font:700 16px var(--bd);letter-spacing:1.8px;text-transform:uppercase;color:var(--mutedL);text-align:center}
.mx .rl{display:grid;grid-template-rows:1fr 1fr;gap:16px}
.mx .rl span{writing-mode:vertical-rl;transform:rotate(180deg);display:grid;place-items:center}
.mx .g{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;min-height:0}
.cards3{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cards3 .opt{padding:28px 26px}
.cards3 .opt .oh{flex-direction:column;align-items:flex-start;gap:20px}
.cards3 .opt .ot{font-size:36px}
.cards3 .opt .od{font-size:22px;margin-top:16px}
.cards3 .lead{grid-column:1/-1}
.g6{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:16px}
.chain{position:absolute;inset:0;display:grid;grid-template-columns:1fr 44px 1.1fr 44px 1fr;grid-template-rows:1fr 30px 1fr 30px 1fr;gap:0}
.chain .opt{padding:12px 16px 10px;flex:1}
.chain .opt .oh{gap:10px}.chain .opt .ol{width:38px;height:38px;font-size:21px;border-radius:11px}
.chain .opt .ot{font-size:22px}.chain .opt .od{font-size:16px;margin-top:4px;line-height:1.28}
.chain .opt .ov{min-height:34px;padding-top:4px}.chain .vd{width:28px;height:28px;font-size:14px}
.chain .opt .eb{margin-bottom:6px}
.chain .eb{font:700 13px var(--bd);letter-spacing:2px;text-transform:uppercase;color:var(--bc);margin-bottom:8px}
.chain .ar{display:grid;place-items:center;color:var(--mutedL)}
.chain .ar svg{width:34px;height:34px}
.chain .core{display:grid;place-items:center;border-radius:22px;background:var(--navy3);box-shadow:inset 0 0 0 2px var(--bl);text-align:center}
.chain .core b{display:block;font:800 30px var(--hd);letter-spacing:1px;color:var(--paper)}
.chain .core small{font:600 16px var(--bd);color:var(--mutedL)}
.chain .side{display:flex;flex-direction:column;justify-content:center;padding:0 10px;font:600 17px/1.35 var(--bd);color:var(--mutedL)}
.cols2{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.cols2 .cc{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:26px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line)}
.cols2 .ch b{display:block;font:800 30px var(--hd);color:var(--paper)}
.cols2 .ch span{font:600 19px var(--bd);color:var(--bl)}
.cols2 .opt{flex:1}
.curve{position:absolute;inset:0;display:grid;grid-template-rows:230px 1fr;gap:14px}
.curve svg,.bell svg{width:100%;height:100%;overflow:visible}
.curve .row,.bell .row{display:grid;gap:12px;min-height:0}
.curve .row{grid-template-columns:repeat(4,1fr)}
.curve .opt .ot,.bell .opt .ot{font-size:23px}
.curve .opt .od,.bell .opt .od{font-size:17px}
.bell{position:absolute;inset:0;display:grid;grid-template-rows:230px 1fr;gap:14px}
.bell .row{grid-template-columns:repeat(5,1fr)}
.bell .opt{padding:16px 14px 12px}
.bell .opt .ol{width:40px;height:40px;font-size:22px}
.bell .opt .oh{flex-direction:column;align-items:flex-start;gap:10px}
.bell .opt .rb,.curve .opt .rb{font-size:13px;letter-spacing:.6px;padding:8px 10px 8px 12px}
.bell .opt .pc{font:800 15px var(--bd);letter-spacing:1px;color:var(--bc)}
.seg-hl{transition:opacity .4s}
.svgt{font:700 15px var(--bd);letter-spacing:1.5px;text-transform:uppercase;fill:#A9B3C7}
.svgb{font:800 22px var(--hd);fill:#F4F2EC}

/* ── TEAMS ── */
.teams{position:absolute;left:64px;right:64px;bottom:28px;height:154px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px}
.teams.many{gap:10px}.teams.many .tm{padding:12px 12px 12px 16px}.teams.many .tm-n{font-size:17px}.teams.many .tm-s{font-size:27px}.teams.many .tm-v{gap:4px}.teams.many .tm-v button{font-size:19px;height:48px}
.tm{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px 14px 20px;border-radius:22px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);overflow:visible}
.tm::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:6px;border-radius:0 6px 6px 0;background:var(--tc)}
.tm-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tm-n{font:700 21px var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-s{font:800 34px var(--hd);color:var(--tc);font-variant-numeric:tabular-nums}
.tm-v{display:flex;gap:6px}
.tm-v button{flex:1;min-width:0;height:52px;max-width:64px;border-radius:12px;background:rgba(244,242,236,.07);font:800 22px var(--hd);color:var(--mutedL);transition:background .15s,color .15s}
.tm-v button:hover{background:rgba(244,242,236,.15);color:var(--paper)}
.tm-v button.sel{background:var(--tc);color:var(--navy)}
.tm-v button:disabled{cursor:default}
.tm-v button.sel.v-ok{background:var(--okL)}
.tm-v button.sel.v-acc{background:var(--accL)}
.tm-v button.sel.v-err{background:var(--errL)}
.tm.voted{box-shadow:inset 0 0 0 2px var(--tc)}
.plus{position:absolute;right:16px;top:-26px;font:800 40px var(--hd);color:var(--okL);animation:up 1.6s ease both;pointer-events:none;text-shadow:0 4px 18px rgba(0,0,0,.5)}
.plus.acc{color:var(--accL)}.plus.zero{color:var(--mutedL)}
@keyframes up{0%{opacity:0;translate:0 20px}20%{opacity:1;translate:0 0}80%{opacity:1}100%{opacity:0;translate:0 -30px}}

/* ── FEEDBACK ── */
.tabs{display:inline-flex;padding:5px;border-radius:999px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);gap:4px;margin-bottom:18px;align-self:flex-start}
.tabs button{height:46px;padding:0 22px;border-radius:999px;font:600 19px var(--bd);color:var(--mutedL)}
.tabs button.on{background:var(--paper);color:var(--navy)}
.fb{display:flex;flex-direction:column;min-height:0;flex:1;overflow:auto}
.fb .vt{font:700 16px var(--bd);letter-spacing:2.5px;text-transform:uppercase;color:var(--okL)}
.fb .va{display:flex;align-items:center;gap:16px;margin:12px 0 14px}
.fb .va i{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--ok);color:#fff;font:800 28px var(--hd);font-style:normal}
.fb .va b{font:800 40px/1.05 var(--hd);letter-spacing:-.8px}
.fb .why{font:400 24px/1.42 var(--bd);margin:0 0 18px}
.fb .others{display:grid;gap:8px;margin-bottom:16px}
.fb .ot2{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;font:400 19px/1.36 var(--bd);color:var(--paper)}
.fb .ot2 i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:800 18px var(--hd);font-style:normal;color:var(--navy);background:var(--errL)}
.fb .ot2.acc i{background:var(--accL)}
.fb .ot2 b{font-weight:700}
.fb .ot2 em{font-style:normal;font-weight:800;font-size:14px;letter-spacing:1.4px;margin-right:6px;color:var(--errL)}
.fb .ot2.acc em{color:var(--accL)}
.key{margin-top:auto;display:flex;gap:16px;align-items:flex-start;padding:16px 20px;border-radius:18px;background:var(--cream);color:var(--ink)}
.key small{display:block;font:700 14px var(--bd);letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.key p{margin:0;font:700 22px/1.32 var(--bd)}
.key svg{flex:none;width:34px;height:34px;color:var(--gold)}
.ins{font:500 18px var(--bd);color:var(--mutedL);margin-top:-8px;margin-bottom:14px}
.ins b{color:var(--paper)}
.act{position:absolute;right:64px;top:122px}

/* ── INTRO ── */
.intro{position:absolute;inset:0;display:grid;grid-template-columns:800px 1fr;gap:56px;padding:150px 64px 80px}
.intro .num{font:800 220px/.8 var(--hd);color:var(--bl);letter-spacing:-8px;opacity:.95}
.intro .h2{margin:30px 0 10px;font-size:76px}
.intro .sub{font:600 28px var(--bd);color:var(--bl)}
.intro .ld{font:400 30px/1.45 var(--bd);color:var(--paper);margin:30px 0}
.intro .rule{display:flex;gap:18px;padding:22px 26px;border-radius:22px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);font:700 26px/1.35 var(--bd);color:var(--goldL)}
.intro .rule i{flex:none;width:8px;border-radius:4px;background:var(--gold)}
.intro .foot{display:flex;align-items:center;gap:22px;margin-top:40px}
.intro .foot span{font:600 22px var(--bd);color:var(--mutedL)}
.intro .dwrap{position:relative;display:flex;flex-direction:column;justify-content:center}
.intro .dwrap .dia{flex:none;height:660px}

/* ── FINAL ── */
.final{position:absolute;inset:0;padding:110px 80px 70px;display:grid;grid-template-columns:860px 1fr;gap:64px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:18px;height:520px;margin-top:40px}
.pd{display:flex;flex-direction:column;align-items:center;gap:14px}
.pd .pn{font:700 26px/1.15 var(--bd);text-align:center}
.pd .ps{font:800 46px var(--hd);color:var(--tc)}
.pd .col{width:100%;border-radius:22px 22px 0 0;background:var(--navy3);box-shadow:inset 0 6px 0 var(--tc);display:grid;place-items:start center;padding-top:20px;font:800 80px var(--hd);color:var(--tc);animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.rank{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1 1 auto}
.rk{display:grid;grid-template-columns:44px 1fr 110px;align-items:center;gap:16px;padding:12px 18px;border-radius:16px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line)}
.rk>b{font:800 26px var(--hd);color:var(--mutedL)}
.rk .rn{font:700 22px var(--bd)}
.rk .rs{font:800 32px var(--hd);text-align:right;color:var(--tc)}
.rk .bb{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.rk .bb span{font:700 14px var(--bd);padding:4px 9px;border-radius:8px;background:rgba(244,242,236,.07);color:var(--mutedL)}
.rk .bb span b{color:var(--paper)}
.hard{flex:none;margin-top:22px;padding:22px 26px;border-radius:22px;background:var(--cream);color:var(--ink)}
.hard small{font:700 15px var(--bd);letter-spacing:2px;text-transform:uppercase;color:var(--err)}
.hard h4{margin:6px 0 6px;font:800 30px var(--hd)}
.hard p{margin:0;font:500 20px/1.4 var(--bd);color:var(--muted)}

/* ── QR / SALA ── */
.ib.qr{gap:12px}.ib.qr b{font:800 22px var(--hd);letter-spacing:2px;color:var(--gold)}
.ndot{width:12px;height:12px;border-radius:50%;background:var(--mutedL);flex:none}
.ndot.ok{background:var(--okL);box-shadow:0 0 0 4px rgba(99,199,149,.2)}.ndot.bad{background:var(--errL);box-shadow:0 0 0 4px rgba(236,123,112,.2)}
.lobby{position:absolute;inset:0;display:grid;grid-template-columns:1fr 720px;gap:64px;padding:130px 80px 70px 96px}
.lobby .h2{font-size:84px;margin:18px 0 22px}
.lobby .steps{margin-bottom:34px}
.lteams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:30px}
.lt{display:flex;align-items:center;gap:14px;height:60px;padding:0 18px;border-radius:16px;background:var(--navy3);box-shadow:inset 0 0 0 1px var(--line);font:700 22px var(--bd)}
.lt i{width:16px;height:16px;border-radius:50%;background:var(--tc);flex:none}
.lt span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt em{font:600 17px var(--bd);font-style:normal;color:var(--mutedL);display:flex;align-items:center;gap:6px}
.lt em svg{width:20px;height:20px}
.lt.on{box-shadow:inset 0 0 0 2px var(--tc)}.lt.on em{color:var(--tc)}
.qrcard{align-self:center;background:var(--cream);color:var(--ink);border-radius:40px;padding:44px 48px 40px;text-align:center;border-top:10px solid var(--gold);box-shadow:0 40px 120px rgba(0,0,0,.35)}
.qrcard .qr{width:520px;height:520px;margin:0 auto}
.qrcard .qr svg{width:100%;height:100%;display:block}
.qrcard small{display:block;margin-top:22px;font:700 16px var(--bd);letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.qrcard .url{font:700 26px var(--bd);margin-top:8px;word-break:break-all}
.qrcard .code{font:800 92px/1 var(--hd);letter-spacing:14px;margin-top:10px;color:var(--ink)}
.panel .qrcard{box-shadow:none;border-top:0;padding:0;background:none}
.tm-p{display:inline-flex;align-items:center;gap:3px;font:700 15px var(--bd);color:var(--tc);margin-left:6px;vertical-align:middle}
.tm-p svg{width:16px;height:16px}
.toast{position:absolute;left:50%;bottom:40px;translate:-50% 0;z-index:60;padding:16px 26px;border-radius:16px;background:var(--cream);color:var(--ink);font:600 21px var(--bd);box-shadow:0 20px 60px rgba(0,0,0,.4);animation:fd .3s ease both}
.btn.busy{opacity:.6;pointer-events:none}

/* ── OVERLAY ── */
#ov{position:absolute;inset:0;z-index:50;background:rgba(10,17,34,.72);backdrop-filter:blur(6px);display:none;place-items:center}
#ov.show{display:grid;animation:fd .3s ease both}
.panel{width:1100px;max-height:900px;overflow:auto;background:var(--cream);color:var(--ink);border-radius:34px;padding:44px 52px;position:relative;border-top:10px solid var(--gold)}
.panel h3{margin:0 0 24px;font:800 52px var(--hd);letter-spacing:-1px}
.panel .x{position:absolute;top:28px;right:30px;width:56px;height:56px;border-radius:50%;background:#EBE8DF;font:500 34px var(--bd);color:var(--ink)}
.brow{display:grid;grid-template-columns:50px 260px 1fr 100px 130px;align-items:center;gap:18px;padding:12px 0;border-top:2px solid #E6E1D6}
.brow b.r{font:800 28px var(--hd);color:var(--muted)}
.brow .bn{font:700 24px var(--bd);display:flex;align-items:center;gap:10px}
.brow .bn i{width:16px;height:16px;border-radius:50%;flex:none}
.brow .track{height:22px;border-radius:11px;background:#EBE8DF;overflow:hidden}
.brow .track div{height:100%;border-radius:11px;transition:width .6s ease}
.brow .bs{font:800 32px var(--hd);text-align:right}
.brow .adj{display:flex;gap:6px}
.brow .adj button{width:58px;height:44px;border-radius:12px;background:#EBE8DF;font:700 17px var(--bd);color:var(--ink)}
.menu{display:grid;gap:12px}
.menu button{display:flex;align-items:center;gap:16px;height:72px;padding:0 26px;border-radius:18px;background:#F1EEE6;font:600 24px var(--bd);color:var(--ink);text-align:left}
.menu button:hover{background:#E9E5DA}
.menu button.danger{color:var(--err)}
.menu svg{width:28px;height:28px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin-top:26px;font:500 19px var(--bd);color:var(--muted)}
.keys kbd{font:700 16px var(--bd);padding:4px 10px;border-radius:8px;background:#EBE8DF;color:var(--ink);justify-self:start}
.note{font:500 18px var(--bd);color:var(--muted);margin-top:10px}
</style>
</head>

<div id="app"><div id="stage"><div id="bar"></div><div id="view"></div><div id="ov"></div></div></div>
<script>
//---------------------------------------------------------------------

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';

const teams=()=>S.cfg.names.slice(0,S.cfg.nt).map((n,k)=>({name:n||('Equipo '+(k+1)),c:TEAMC[k]}));
function totals(){const t=new Array(S.cfg.nt).fill(0);Object.values(S.hist).forEach(h=>{if(h)h.forEach((p,k)=>{if(k<t.length)t[k]+=p})});return t.map((v,k)=>v+(S.adj[k]||0))}
const curCase=()=>CASES[S.seq[S.i]];
const optsOf=b=>b.opts.map((o,k)=>Object.assign({L:L[k]},o));

/* ── RED / SALA QR ── */
const NET={ok:null,busy:false,present:{},local:{},pubT:0};
async function api(path,opts){const r=await fetch('/api'+path,Object.assign({cache:'no-store'},opts||{}));let j={};try{j=await r.json()}catch(e){}if(!r.ok){const er=new Error(j.error||('http_'+r.status));er.status=r.status;throw er}return j}
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
const joinURL=()=>S.room?location.origin+'/play.html?c='+S.room.code:'';
function netMark(ok){NET.ok=ok;$$('.ndot').forEach(d=>{d.classList.toggle('ok',ok===true);d.classList.toggle('bad',ok===false)})}
function toast(t,ms){const d=document.createElement('div');d.className='toast';d.textContent=t;stage.appendChild(d);setTimeout(()=>d.remove(),ms||3500)}
function qrSVG(text){try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;
 return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#FCFBF8"/><path d="${d}" fill="#101B33"/></svg>`}catch(e){return ''}}
function qrCard(){return `<div class="qrcard"><div class="qr">${qrSVG(joinURL())}</div><small>Escanea o entra a</small><div class="url">${esc(location.host)}/play.html</div><small>Código de la sala</small><div class="code">${S.room.code}</div></div>`}
function pubState(){const st={v:Date.now(),total:T.total||null,phase:S.phase==='lobby'?'lobby':S.phase,teams:teams().map(t=>({name:t.name,c:t.c})),totals:totals(),n:S.seq.length,i:S.i};
 if(S.phase==='intro'||S.phase==='case'){const c=curCase(),b=BL[c.b];st.block={n:b.n,name:b.name,sub:b.sub,c:b.c,l:b.l}}
 if(S.phase==='case'){const c=curCase(),b=BL[c.b];Object.assign(st,{e:c.e,s:c.s,sit:c.sit,dat:c.dat,q:b.q,opts:optsOf(b).map(o=>({id:o.id,L:o.L,t:o.t,d:o.d})),revealed:!!S.revealed,timed:!!T.total,running:!!(T.run&&!S.revealed),remaining:T.total?Math.max(0,T.left):null});
  if(S.revealed){st.sc=c.sc;st.why=c.why;st.key=c.key;st.n2=c.n;st.pts=S.hist[S.i]||null}}
 return st}
function publish(now){if(!S.room)return;clearTimeout(NET.pubT);const go=()=>post('/state',{code:S.room.code,key:S.room.key,state:pubState()}).then(()=>netMark(true)).catch(()=>netMark(false));if(now)return go();NET.pubT=setTimeout(go,120)}
async function pollOnce(){if(!S.room)return null;const q=new URLSearchParams({code:S.room.code,key:S.room.key});if(S.phase==='case')q.set('i',S.i);
 const r=await api('/poll?'+q.toString());netMark(true);NET.present=r.present||{};
 if(S.phase==='case'&&!S.revealed&&r.votes){const v=S.votes[S.i]=S.votes[S.i]||{};let ch=false;const nowt=Date.now();
  for(let k=0;k<S.cfg.nt;k++){if(NET.local[k]&&nowt-NET.local[k]<3500)continue;const sv=r.votes[k]||undefined;if(v[k]!==sv){if(sv)v[k]=sv;else delete v[k];ch=true}}
  if(ch){save();refreshStrip();paintVotes()}}
 paintPresence();return r}
async function pollTick(){if(!S.room||NET.busy||document.hidden)return;if(!(S.phase==='lobby'||S.phase==='intro'||(S.phase==='case'&&!S.revealed)))return;
 NET.busy=true;try{await pollOnce()}catch(e){netMark(false)}finally{NET.busy=false}}
setInterval(pollTick,1500);
function paintPresence(){$$('.lt').forEach(el=>{const k=el.dataset.t,n=NET.present[k]||0;el.classList.toggle('on',n>0);el.querySelector('em').innerHTML=n?`${IC.phone}${n} conectado${n===1?'':'s'}`:'Esperando…'});
 $$('.tm').forEach(el=>{const p=el.querySelector('.tm-p');if(!p)return;const n=NET.present[el.dataset.t]||0;p.style.display=n?'':'none';p.lastChild.textContent=n})}
function openQR(){if(!S.room)return;ov.innerHTML=`<div class="panel" style="width:720px;text-align:center"><button class="x" data-x>×</button>${qrCard()}</div>`;ov.classList.add('show')}

/* ── SCALE ── */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ── AUDIO ── */
let actx=null;
function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v||.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

/* ── TIMER ── */
const T={left:0,total:0,run:false,last:0,id:0,done:false};
function timerStart(){clearInterval(T.id);T.total=S.cfg.time;T.left=T.total;T.done=false;if(!T.total){paintTimer();return}T.run=true;T.last=performance.now();T.id=setInterval(tick,200);paintTimer();publish()}
function timerStop(){clearInterval(T.id);T.run=false;paintTimer()}
function timerToggle(){if(!T.total||S.revealed)return;if(T.run){timerStop()}else{if(T.left<=0)return;T.run=true;T.last=performance.now();clearInterval(T.id);T.id=setInterval(tick,200);paintTimer()}publish()}
function tick(){const n=performance.now();T.left-=(n-T.last)/1000;T.last=n;if(T.left<=0){T.left=0;clearInterval(T.id);T.run=false;if(!T.done){T.done=true;beep(660,.25);setTimeout(()=>beep(440,.5),260);publish()}}paintTimer()}
function paintTimer(){const el=$('.timer');if(!el)return;if(!T.total){el.classList.add('off');return}
 const C=2*Math.PI*30,f=el.querySelector('.tf');f.style.strokeDasharray=C;f.style.strokeDashoffset=C*(1-T.left/T.total);
 el.querySelector('span').textContent=Math.ceil(T.left);el.classList.toggle('warn',T.left<=10);el.classList.toggle('out',T.left<=0&&!S.revealed);el.classList.toggle('paused',!T.run&&T.left>0)}

/* ── PROGRESS ── */
function bar(){const b=$('#bar');if(S.phase==='setup'){b.style.width='0';return}const n=S.seq.length||1;const d=S.phase==='final'?n:S.i+(S.revealed?1:0);b.style.width=(d/n*100)+'%'}

/* ── RENDER ROUTER ── */
function render(){view.innerHTML='';const w=document.createElement('div');w.className='fade';w.style.cssText='position:absolute;inset:0';view.appendChild(w);
 ({setup:rSetup,lobby:rLobby,intro:rIntro,case:rCase,final:rFinal})[S.phase](w);bar();if(S.phase!=='setup'&&S.phase!=='case')publish();paintPresence();netMark(NET.ok)}

/* ── SETUP ── */
function rSetup(w){
 const c=S.cfg;const nCases=CASES.filter(x=>c.blocks.includes(x.b)).length;
 const prog=resumable?`<div class="resume">${S.done?'Partida terminada: <b>resultados disponibles</b>':`Partida en curso: <b>caso ${S.i+1} de ${S.seq.length}</b>`}<button class="btn sm" data-a="resume">${IC.play}${S.done?'Ver resultados':'Continuar'}</button></div>`:'';
 w.innerHTML=`<div class="setup">
 <div class="hero">
  <div class="uni"><b>ECOTEC</b><span></span><i>MBA · Decisiones Estratégicas<br>y Marketing</i></div>
  <div class="eyebrow">Parte 2 · Estrategias de marketing</div>

   <li><b>4</b><span>Discutan por qué: cada opción tiene su explicación.</span></li>
  </ol>
  <div class="prof">Prof. Mgs. <b>Patricio Toro Orellana</b></div>
 </div>
 <div class="cfg">
  ${prog}
  <div><h3>Equipos</h3>
   <div class="stepper"><button data-a="nt-">−</button><b>${c.nt}</b><button data-a="nt+">+</button><span class="note" style="margin:0 0 0 10px">De 2 a 8 equipos. Haz clic en el nombre para editarlo.</span></div>
   <div class="names">${teams().map((t,k)=>`<label><i style="background:${t.c}"></i><input data-k="${k}" maxlength="18" value="${esc(c.names[k])}"></label>`).join('')}</div>
  </div>
  <div><h3>Bloques temáticos <button class="mini" data-a="all">Todos</button><button class="mini" data-a="none">Ninguno</button></h3>
   <div class="blocks">${BLOCKS.map(b=>`<button class="bk ${c.blocks.includes(b.id)?'on':''}" style="--bc:${b.c}" data-b="${b.id}"><span class="bn">${b.n}</span><span class="bt">${b.name}</span></button>`).join('')}</div>
  </div>
  <div class="row3">
   <div><h3>Orden de los casos</h3><div class="seg">${[['bloque','Por bloques'],['mezcla','Mezclados']].map(([v,t])=>`<button class="${c.order===v?'on':''}" data-o="${v}">${t}</button>`).join('')}</div></div>
   <div><h3>Repaso por bloque</h3><div class="seg">${[[true,'Sí'],[false,'No']].map(([v,t])=>`<button class="${c.intros===v?'on':''}" data-in="${v}">${t}</button>`).join('')}</div></div>
   <div><h3>Voto por celular (QR)</h3><div class="seg">${[[true,'Sí'],[false,'No']].map(([v,t])=>`<button class="${c.qr===v?'on':''}" data-qr="${v}">${t}</button>`).join('')}</div></div>
  </div>
  <div><h3>Tiempo por caso</h3><div class="seg">${[[0,'Libre'],[60,'60 s'],[90,'90 s'],[120,'2 min'],[180,'3 min']].map(([v,t])=>`<button class="${c.time===v?'on':''}" data-t="${v}">${t}</button>`).join('')}</div></div>
  <div class="go"><div class="sum"><b>${nCases}</b> casos · ${c.blocks.length} bloque${c.blocks.length===1?'':'s'} · ~${Math.round(nCases*3)} min</div>
   <button class="btn" data-a="start" ${nCases?'':'disabled'}>Comenzar partida ${IC.arrow}</button></div>
 </div></div>`;
 w.querySelectorAll('input[data-k]').forEach(i=>i.addEventListener('input',e=>{c.names[+i.dataset.k]=i.value;save()}));
 w.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.a==='nt-'){c.nt=Math.max(2,c.nt-1)}else if(d.a==='nt+'){c.nt=Math.min(8,c.nt+1)}
  else if(d.a==='all'){c.blocks=BLOCKS.map(b=>b.id)}else if(d.a==='none'){c.blocks=[]}
  else if(d.b){c.blocks=c.blocks.includes(d.b)?c.blocks.filter(x=>x!==d.b):BLOCKS.map(b=>b.id).filter(x=>x===d.b||c.blocks.includes(x))}
  else if(d.o){c.order=d.o}else if(d.qr){c.qr=d.qr==='true';if(c.qr&&!/^https?:/.test(location.protocol)){c.qr=false;toast('El voto por QR funciona al abrir el juego desde su dirección web, no desde un archivo local.',5000)}}else if(d.in){c.intros=d.in==='true'}else if(d.t!==undefined){c.time=+d.t}
  else if(d.a==='start'){return start()}else if(d.a==='resume'){resumable=false;return resumeGame()}
  else return;
  if(resumable&&(d.a==='nt-'||d.a==='nt+'))resumable=false;
  save();render()});
}
async function start(){const c=S.cfg;let room=null;
 if(c.qr){const b=$('[data-a="start"]');if(b){b.classList.add('busy');b.lastChild&&(b.firstChild.textContent='Creando sala… ')}
  try{room=await post('/room',{});netMark(true)}catch(e){netMark(false);toast('No se pudo crear la sala QR. Se juega con votación manual.',5000)}
  if(b)b.classList.remove('busy')}
 let seq=[];BLOCKS.forEach(b=>{if(c.blocks.includes(b.id))CASES.forEach((x,k)=>{if(x.b===b.id)seq.push(k)})});
 if(c.order==='mezcla'){for(let i=seq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}}
 Object.assign(S,{done:false,seq,i:0,votes:{},hist:{},adj:[0,0,0,0,0,0,0,0],intro:{},revealed:false,tab:'fb',room:room?{code:room.code,key:room.key}:null});resumable=false;NET.present={};
 if(S.room){S.phase='lobby';save();return go()}enterCase()}
function resumeGame(){if(S.done){S.phase='final';save();return render()}if(S.room&&S.lobby){S.phase='lobby';save();return go()}const c=curCase();S.phase=(S.cfg.intros&&!S.intro[c.b])?'intro':'case';save();go()}
function enterCase(){const c=curCase();S.revealed=!!S.hist[S.i];
 S.phase=(S.cfg.intros&&!S.intro[c.b])?'intro':'case';save();go()}
function go(){S.lobby=S.phase==='lobby';render();if(S.phase==='case'&&!S.revealed)timerStart();else{timerStop();if(S.phase==='case')publish()}}

/* ── DIAGRAMS ── */
function optHTML(o,b,tag){const tg=tag||'button';
 return `<${tg} class="opt" data-id="${o.id}" style="--bc:${b.c}">
  <div class="oh"><span class="ol">${o.L}</span>${o.p?`<span class="pc">${o.p}</span>`:''}<span class="ot">${o.t}</span>${o.r?`<span class="or">${o.r}</span>`:''}</div>
  <div class="od">${o.d}</div><div class="ov"></div><span class="rb"></span></${tg}>`}
function diagram(b,stat){const O=optsOf(b),tg=stat?'div':'button',oh=o=>optHTML(o,b,tg),get=id=>O.find(o=>o.id===id);
 const wrap=h=>`<div class="dia ${stat?'static':''}" style="--bc:${b.c};--bl:${b.l}">${h}</div>`;
 if(b.layout==='matrix'){const a=b.axes;
  return wrap(`<div class="mx"><div></div><div class="cl"><span>${a.cols[0]}</span><span>${a.cols[1]}</span></div>
   <div class="rl"><span>${a.rows[0]}</span><span>${a.rows[1]}</span></div><div class="g">${O.map(oh).join('')}</div></div>`)}
 if(b.layout==='cards')return wrap(`<div class="cards3">${O.map(oh).join('')}</div>`);
 if(b.layout==='grid6')return wrap(`<div class="g6">${O.map(oh).join('')}</div>`);
 if(b.layout==='chain'){const p=(id,eb,st)=>{const o=get(id);return `<div style="${st};display:flex;flex-direction:column;min-height:0">${oh(o).replace('<div class="oh">',`<div class="eb">${eb}</div><div class="oh">`)}</div>`};
  return wrap(`<div class="chain">
   ${p('arriba','Proveedores','grid-column:3;grid-row:1')}
   <div class="ar" style="grid-column:3;grid-row:2">${IC.up}</div>
   ${p('horiz','Competidores · absorber','grid-column:1;grid-row:3')}
   <div class="ar" style="grid-column:2;grid-row:3">${IC.left}</div>
   <div class="core" style="grid-column:3;grid-row:3"><div><b>EMPRESA</b><small>Cadena de valor</small></div></div>
   <div class="ar" style="grid-column:4;grid-row:3">${IC.right}</div>
   ${p('lat','Competidores · aliarse','grid-column:5;grid-row:3')}
   <div class="ar" style="grid-column:3;grid-row:4">${IC.down}</div>
   ${p('abajo','Canal / cliente','grid-column:3;grid-row:5')}
   <div class="side" style="grid-column:1;grid-row:1/3">Hacia arriba: integrar al proveedor.</div>
   <div class="side" style="grid-column:5;grid-row:1/3;text-align:right">Horizontal: crecer en el mismo eslabón.</div>
   <div class="side" style="grid-column:1;grid-row:4/6">Hacia abajo: acercarse al cliente.</div>
  </div>`)}
 if(b.layout==='columns'){return wrap(`<div class="cols2">${b.cols.map((c,k)=>`<div class="cc"><div class="ch"><b>${c.t}</b><span>${c.s}</span></div>${O.slice(k*2,k*2+2).map(oh).join('')}</div>`).join('')}</div>`)}
 if(b.layout==='curve'){const W=956,H=230,z=170;
  const st=[0,1,2,3].map(k=>`<rect class="seg-hl" data-seg="${O[k].id}" x="${k*W/4+2}" y="0" width="${W/4-4}" height="${H}" rx="14" fill="${b.l}" opacity="0"/>`).join('');
  return wrap(`<div class="curve"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${st}
   ${[1,2,3].map(k=>`<line x1="${k*W/4}" x2="${k*W/4}" y1="10" y2="${H}" stroke="rgba(244,242,236,.18)" stroke-dasharray="6 7" stroke-width="2"/>`).join('')}
   <line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="rgba(244,242,236,.25)" stroke-width="2"/>
   <path d="M0,${H-12} C140,${H-14} 200,${H-60} 300,130 S450,34 600,30 S820,80 ${W},150" fill="none" stroke="${b.l}" stroke-width="6" stroke-linecap="round"/>
   <path d="M0,${H-6} C110,${H} 200,${H-20} 270,${z-6} S430,74 530,70 S770,118 ${W},${z+18}" fill="none" stroke="#F4F2EC" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
   <line x1="16" x2="46" y1="62" y2="62" stroke="${b.l}" stroke-width="6" stroke-linecap="round"/><text class="svgt" x="56" y="67">Ventas</text>
   <line x1="16" x2="46" y1="90" y2="90" stroke="#F4F2EC" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><text class="svgt" x="56" y="95">Utilidades</text>
   ${['Introducción','Crecimiento','Madurez','Declive'].map((t,k)=>`<text class="svgt" x="${k*W/4+16}" y="28">${t}</text>`).join('')}
  </svg><div class="row">${O.map(oh).join('')}</div></div>`)}
 if(b.layout==='bell'){const W=956,H=230,m=W/2,sd=W/7.2,base=H-8,amp=H-40;
  const y=x=>base-amp*Math.exp(-((x-m)**2)/(2*sd*sd));const bd=[0,m-2*sd,m-sd,m,m+sd,W];
  let segs='';for(let k=0;k<5;k++){let d=`M${bd[k]},${base}`;for(let x=bd[k];x<=bd[k+1]+.1;x+=4)d+=` L${Math.min(x,bd[k+1]).toFixed(1)},${y(Math.min(x,bd[k+1])).toFixed(1)}`;d+=` L${bd[k+1]},${base} Z`;
   segs+=`<path class="seg-hl" data-seg="${O[k].id}" d="${d}" fill="${b.l}" opacity="${[.25,.4,.55,.4,.25][k]}" data-op="${[.25,.4,.55,.4,.25][k]}" stroke="#101B33" stroke-width="3"/>`;
   const cx=(bd[k]+bd[k+1])/2;segs+=`<text class="svgb" x="${cx}" y="${k===0||k===4?base-30:Math.max(y(cx)+44,80)}" text-anchor="middle">${O[k].p}</text>`}
  return wrap(`<div class="bell"><svg viewBox="0 0 ${W} ${H}">${segs}<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="rgba(244,242,236,.3)" stroke-width="2"/></svg><div class="row">${O.map(oh).join('')}</div></div>`)}
}

/* ── CASE ── */
function caseLeft(c,b){const ins=c.o==='gl'?`Inspirado en caso real`:'Ecuador · caso ilustrativo';
 return `<div class="origin"><span class="tag">${ins}</span></div>
  <div class="emp">${esc(c.e)}</div><div class="sector">${esc(c.s)}</div>
  <p class="sit">${c.sit}</p>
  <div class="datos">${c.dat.map(([k,v])=>`<div class="dato"><small>${k}</small><b>${v}</b></div>`).join('')}</div>
  <div class="hint"><b>Pista:</b> ${c.hint}</div>
  <div class="qq"><i></i><p>${b.q}</p></div>`}
function feedback(c,b){const O=optsOf(b),best=O.find(o=>c.sc[o.id]===100);
 const others=O.filter(o=>o!==best).sort((x,y)=>(c.sc[y.id]||0)-(c.sc[x.id]||0));
 return `<div class="fb"><div class="vt">Decisión óptima</div>
  <div class="va"><i>${best.L}</i><b>${best.t}</b></div>
  ${c.ins?`<div class="ins">Caso inspirado en <b>${c.ins}</b> · simplificado para fines didácticos.</div>`:''}
  <p class="why">${c.why}</p>
  <div class="others">${others.map(o=>{const a=c.sc[o.id]===40;return `<div class="ot2 ${a?'acc':''}"><i>${o.L}</i><div><em>${a?'ACEPTABLE +40':'ERRÓNEA'}</em><b>${o.t}.</b> ${c.n[o.id]||''}</div></div>`}).join('')}</div>
  <div class="key">${IC.key}<div><small>Concepto clave</small><p>${c.key}</p></div></div></div>`}
function rCase(w){const c=curCase(),b=BL[c.b];
 w.innerHTML=header(b)+`<div class="left" style="--bl:${b.l}">${S.revealed?`<div class="tabs"><button data-tab="fb" class="${S.tab==='fb'?'on':''}">Retroalimentación</button><button data-tab="case" class="${S.tab==='case'?'on':''}">Planteamiento</button></div>`:''}<div class="lbody" style="display:flex;flex-direction:column;flex:1;min-height:0">${S.revealed&&S.tab==='fb'?feedback(c,b):caseLeft(c,b)}</div></div>
  <div class="right"><div class="dtitle"><span>${(b.name+' · '+b.sub).length<46?b.name+' · '+b.sub:b.name}</span><em>${S.revealed?'Clic en “Siguiente” o barra espaciadora':'Elige por equipo abajo · Enter para revelar'}</em></div>${diagram(b,false)}
   <div style="display:flex;justify-content:flex-end;gap:14px;margin-top:18px">${S.revealed?`<button class="btn" data-a="next">${S.i+1>=S.seq.length?'Ver resultados':'Siguiente caso'} ${IC.arrow}</button>`:`<button class="btn" data-a="reveal">${IC.eye}Revelar decisión</button>`}</div></div>`+teamStrip(b);
 // shrink diagram area for button row
 w.querySelector('.right .dia').style.flex='1';
 paintVotes();if(S.revealed)paintReveal(false);
 w.addEventListener('click',onCaseClick);
}
function onCaseClick(e){const t=e.target.closest('[data-a],[data-v],[data-tab],.opt');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;save();const c=curCase(),b=BL[c.b];const lb=$('.lbody');lb.innerHTML=S.tab==='fb'?feedback(c,b):caseLeft(c,b);$$('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.tab));return}
 if(t.dataset.v){if(S.revealed)return;const k=+t.closest('.tm').dataset.t;const v=S.votes[S.i]=S.votes[S.i]||{};v[k]=v[k]===t.dataset.v?undefined:t.dataset.v;if(!v[k])delete v[k];save();beep(880,.06,.05);refreshStrip();paintVotes();paintPresence();
  if(S.room){NET.local[k]=Date.now();post('/vote',{code:S.room.code,key:S.room.key,team:k,i:S.i,opt:v[k]||null}).then(()=>netMark(true)).catch(()=>netMark(false))}return}
 const a=t.dataset.a;
 if(a==='reveal')reveal();else if(a==='next')next();else if(a==='hint')toggleHint();else if(a==='board')openBoard();else if(a==='fs')fs();else if(a==='menu')openMenu();else if(a==='timer')timerToggle();else if(a==='qr')openQR();
}
function refreshStrip(){const c=curCase(),b=BL[c.b];const old=$('.teams');if(!old)return;const d=document.createElement('div');d.innerHTML=teamStrip(b);old.replaceWith(d.firstChild);paintPresence()}
function paintVotes(){const v=S.votes[S.i]||{},tm=teams();$$('.dia .opt').forEach(el=>{const id=el.dataset.id;el.querySelector('.ov').innerHTML=tm.map((t,k)=>v[k]===id?`<span class="vd" style="--tc:${t.c}" title="${esc(t.name)}">${k+1}</span>`:'').join('')})}
function toggleHint(){const h=$('.hint');if(h)h.classList.toggle('show');else if(S.revealed){S.tab='case';save();render();setTimeout(()=>{const x=$('.hint');x&&x.classList.add('show')},20)}}
function paintReveal(anim){const c=curCase();
 $$('.dia .opt').forEach(el=>{const s=c.sc[el.dataset.id]||0;el.classList.add(s===100?'r-ok':s===40?'r-acc':'r-err');el.querySelector('.rb').textContent=s===100?'✓ ÓPTIMA +100':s===40?'ACEPTABLE +40':'ERRÓNEA 0'});
 $$('.seg-hl').forEach(el=>{const s=c.sc[el.dataset.seg]||0;if(el.tagName==='rect')el.setAttribute('opacity',s===100?.22:0);else el.setAttribute('opacity',s===100?.95:.12)});
 const v=S.votes[S.i]||{};$$('.tm').forEach(tm=>{const k=+tm.dataset.t;const sel=tm.querySelector('button.sel');if(sel){const s=c.sc[v[k]]||0;sel.classList.add(s===100?'v-ok':s===40?'v-acc':'v-err')}
  if(anim){const p=(S.hist[S.i]||[])[k]||0;const f=document.createElement('div');f.className='plus '+(p===100?'':p===40?'acc':'zero');f.textContent=p?'+'+p:(v[k]?'0':'sin voto');if(!p)f.style.fontSize='26px';tm.appendChild(f)}})}
async function reveal(){if(S.phase!=='case'||S.revealed||NET.revealing)return;
 if(S.room){NET.revealing=true;const rb=$('[data-a="reveal"]');if(rb)rb.classList.add('busy');timerStop();
  try{NET.local={};await Promise.race([(async()=>{while(NET.busy)await new Promise(r=>setTimeout(r,100));NET.busy=true;try{await pollOnce()}finally{NET.busy=false}})(),new Promise(r=>setTimeout(r,3500))])}catch(e){netMark(false)}
  NET.revealing=false;if(rb)rb.classList.remove('busy');if(S.revealed)return}
 const c=curCase(),v=S.votes[S.i]||{};
 const before=totals();S.hist[S.i]=teams().map((t,k)=>c.sc[v[k]]||0);S.revealed=true;S.tab='fb';save();timerStop();
 beep(523,.12,.08);setTimeout(()=>beep(784,.25,.08),120);
 const b=BL[c.b];$('.lbody').innerHTML=feedback(c,b);
 const l=$('.left');l.insertAdjacentHTML('afterbegin',`<div class="tabs"><button data-tab="fb" class="on">Retroalimentación</button><button data-tab="case">Planteamiento</button></div>`);
 $('.lbody').classList.add('fade');
 $('.right .dtitle em').textContent='Clic en “Siguiente” o barra espaciadora';
 const btn=$('[data-a="reveal"]');btn.outerHTML=`<button class="btn" data-a="next">${S.i+1>=S.seq.length?'Ver resultados':'Siguiente caso'} ${IC.arrow}</button>`;
 refreshStrip();paintReveal(true);bar();publish(true);
 const after=totals();$$('.tm-s').forEach((el,k)=>countUp(el,before[k],after[k]));
}
function countUp(el,a,b){if(a===b){el.textContent=b;return}const t0=performance.now(),d=900;el.textContent=a;(function f(n){const p=Math.min(1,(n-t0)/d);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function next(){if(S.phase==='intro'){S.intro[curCase().b]=true;S.phase='case';save();return go()}
 if(S.phase!=='case')return;if(!S.revealed)return reveal();
 if(S.i+1>=S.seq.length){S.phase='final';S.done=true;save();timerStop();return render()}
 S.i++;S.tab='fb';enterCase()}

/* ── INTRO ── */
function rIntro(w){const c=curCase(),b=BL[c.b];const n=S.seq.filter(k=>CASES[k].b===b.id).length;
 w.innerHTML=header(b)+`<div class="intro" style="--bl:${b.l}"><div>
  <div class="num">${b.n}</div><h2 class="h2">${b.name}</h2><div class="sub">${b.sub}</div>
  <p class="ld">${b.lead}</p><div class="rule"><i></i><span>${b.rule}</span></div>
  <div class="foot"><button class="btn" data-a="go">Empezar bloque ${IC.arrow}</button><span>${n} caso${n===1?'':'s'} en este bloque</span></div></div>
  <div class="dwrap">${diagram(b,true)}</div></div>`;
 const tm=w.querySelector('.timer');if(tm)tm.classList.add('off');
 w.querySelector('[data-a="hint"]').style.display='none';
 w.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(a==='go')next();else if(a==='board')openBoard();else if(a==='fs')fs();else if(a==='menu')openMenu();else if(a==='qr')openQR()})}

/* ── LOBBY ── */
function rLobby(w){w.innerHTML=`<div class="hdr"><div class="brand"><b>Decide la estrategia</b><span>ECOTEC · MBA</span></div><span class="sp"></span>
  <span class="ib"><span class="ndot"></span>Sala ${S.room.code}</span><button class="ib" data-a="fs">${IC.full}</button><button class="ib" data-a="menu">${IC.menu}</button></div>
 <div class="lobby"><div><div class="eyebrow">Sala de juego · ${S.seq.length} casos</div><h2 class="h2">Únanse desde<br>su celular</h2>
  <ol class="steps"><li><b>1</b><span>Escaneen el código QR con la cámara.</span></li><li><b>2</b><span>Elijan su equipo (pueden entrar varios celulares por equipo).</span></li><li><b>3</b><span>En cada caso voten desde el celular: vale el último voto del equipo.</span></li></ol>
  <div class="lteams">${teams().map((t,k)=>`<div class="lt" data-t="${k}" style="--tc:${t.c}"><i></i><span>${esc(t.name)}</span><em>Esperando…</em></div>`).join('')}</div>
  <button class="btn" data-a="begin">Comenzar juego ${IC.arrow}</button></div>
 ${qrCard()}</div>`;
 w.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(a==='begin'){S.lobby=false;enterCase()}else if(a==='fs')fs();else if(a==='menu')openMenu()});
 pollTick()}

/* ── FINAL ── */
function stats(){const tm=teams(),tot=totals();const per=tm.map(()=>({}));
 S.seq.forEach((ci,i)=>{const h=S.hist[i];if(!h)return;const b=CASES[ci].b;tm.forEach((t,k)=>{const o=per[k][b]=per[k][b]||{p:0,n:0};o.p+=h[k];o.n++})});
 const order=tm.map((t,k)=>({...t,k,s:tot[k]})).sort((a,b)=>b.s-a.s);let r=0;order.forEach((o,i)=>{if(i===0||o.s<order[i-1].s)r=i+1;o.r=r});
 let hard=null;S.seq.forEach((ci,i)=>{const h=S.hist[i];if(!h)return;const avg=h.reduce((a,b)=>a+b,0)/h.length;if(!hard||avg<hard.avg)hard={ci,avg}});
 return {order,per,hard}}
function rFinal(w){const {order,per,hard}=stats();const top=[order[1],order[0],order[2]];const hts=[330,430,250];
 w.innerHTML=`<div class="hdr"><div class="brand"><b>Decide la estrategia</b><span>ECOTEC · MBA</span></div><span class="sp"></span>
  <button class="ib" data-a="csv">${IC.dl}Exportar resultados</button><button class="ib" data-a="board">${IC.board}Ajustar puntos</button><button class="ib" data-a="fs">${IC.full}</button><button class="ib" data-a="home">${IC.home}Nueva partida</button></div>
 <div class="final"><div><div class="eyebrow">Resultados finales</div><h2 class="h2" style="font-size:84px;margin-top:14px">${order[0].s>0?esc(order[0].name)+'<br>toma la mejor decisión':'Fin de la partida'}</h2>
  <div class="podium">${top.map((o,i)=>o?`<div class="pd" style="--tc:${o.c}"><div class="pn">${esc(o.name)}</div><div class="ps">${o.s}</div><div class="col" style="height:${hts[i]}px;animation-delay:${[.25,.5,0][i]}s">${o.r}</div></div>`:'<div></div>').join('')}</div></div>
  <div style="display:flex;flex-direction:column;min-height:0"><div class="rank">${order.map(o=>`<div class="rk" style="--tc:${o.c}"><b>${o.r}</b><span class="rn">${esc(o.name)}</span><span class="rs">${o.s}</span>
   <div class="bb">${BLOCKS.filter(b=>per[o.k][b.id]).map(b=>{const x=per[o.k][b.id];return `<span>${b.k}: <b>${Math.round(x.p/x.n)}%</b></span>`}).join('')}</div></div>`).join('')}</div>
  ${hard?(()=>{const c=CASES[hard.ci],b=BL[c.b],best=optsOf(b).find(o=>c.sc[o.id]===100);return `<div class="hard"><small>El caso más desafiante</small><h4>${esc(c.e)}</h4><p>${b.name} · promedio del grupo: <b>${Math.round(hard.avg)}%</b>. La decisión óptima era <b>${best.L} · ${best.t}</b>. ${c.key}</p></div>`})():''}
 </div></div>`;
 w.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(a==='csv')csv();else if(a==='board')openBoard();else if(a==='fs')fs();else if(a==='home'){S=Object.assign(fresh(),{cfg:S.cfg,room:null});resumable=false;save();render()}})}
function csv(){const tm=teams();const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[['N°','Bloque','Empresa','Óptima',...tm.flatMap(t=>[t.name+' (voto)',t.name+' (pts)'])].map(q).join(';')];
 S.seq.forEach((ci,i)=>{const c=CASES[ci],b=BL[c.b],O=optsOf(b),best=O.find(o=>c.sc[o.id]===100),v=S.votes[i]||{},h=S.hist[i];
  rows.push([i+1,b.name,c.e,best.L+' · '+best.t,...tm.flatMap((t,k)=>{const o=O.find(x=>x.id===v[k]);return [o?o.L:'',h?h[k]:'']})].map(q).join(';'))});
 const tot=totals();rows.push(['','','','Ajustes',...tm.flatMap((t,k)=>['',S.adj[k]||0])].map(q).join(';'));rows.push(['','','','TOTAL',...tm.flatMap((t,k)=>['',tot[k]])].map(q).join(';'));
 const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='decide-la-estrategia-resultados-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ── OVERLAYS ── */
function closeOv(){ov.classList.remove('show');ov.innerHTML=''}
function openBoard(){const tot=totals(),tm=teams();const mx=Math.max(100,...tot);
 const order=tm.map((t,k)=>({...t,k,s:tot[k]})).sort((a,b)=>b.s-a.s);
 ov.innerHTML=`<div class="panel"><button class="x" data-x>×</button><h3>Marcador</h3>
  ${order.map((o,i)=>`<div class="brow"><b class="r">${i+1}</b><span class="bn"><i style="background:${o.c}"></i>${esc(o.name)}</span><div class="track"><div style="width:${Math.max(0,o.s)/mx*100}%;background:${o.c}"></div></div><span class="bs">${o.s}</span><span class="adj"><button data-adj="${o.k}" data-d="-10">−10</button><button data-adj="${o.k}" data-d="10">+10</button></span></div>`).join('')}
  <p class="note">Usa −10 / +10 para bonificar un buen argumento o penalizar. ${S.seq.length?`Casos jugados: ${Object.keys(S.hist).length} de ${S.seq.length}.`:''}</p></div>`;
 ov.classList.add('show')}
function openMenu(){ov.innerHTML=`<div class="panel" style="width:820px"><button class="x" data-x>×</button><h3>Menú</h3><div class="menu">
  <button data-m="close">${IC.play}Volver al juego</button>
  ${S.phase==='case'&&!S.revealed?`<button data-m="time">${IC.time}Reiniciar tiempo del caso</button><button data-m="skip">${IC.skip}Saltar este caso (sin puntaje)</button>`:''}
  ${S.room?`<button data-m="qr">${IC.qric}Mostrar código QR de la sala</button>`:''}
  <button data-m="board">${IC.board}Marcador y ajustes</button>
  <button data-m="home" class="danger">${IC.home}Terminar y volver a configuración</button></div>
  <div class="keys"><kbd>Espacio / Enter</kbd><span>Revelar decisión · Siguiente caso</span><kbd>H</kbd><span>Mostrar pista</span><kbd>P</kbd><span>Pausar o reanudar el tiempo</span><kbd>R</kbd><span>Reiniciar el tiempo</span><kbd>M</kbd><span>Marcador</span><kbd>Q</kbd><span>Mostrar el QR de la sala</span><kbd>F</kbd><span>Pantalla completa</span><kbd>Esc</kbd><span>Cerrar ventanas</span></div></div>`;
 ov.classList.add('show')}
ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-x]'))return closeOv();const t=e.target.closest('button');if(!t)return;
 if(t.dataset.adj!==undefined){const k=+t.dataset.adj;S.adj[k]=(S.adj[k]||0)+ +t.dataset.d;save();openBoard();publish();const s=$$('.tm-s')[k];if(s)s.textContent=totals()[k];return}
 const m=t.dataset.m;if(!m)return;
 if(m==='close')closeOv();else if(m==='qr')openQR();else if(m==='board')openBoard();else if(m==='time'){closeOv();timerStart()}
 else if(m==='skip'){closeOv();S.hist[S.i]=null;delete S.hist[S.i];S.revealed=true;if(S.i+1>=S.seq.length){S.phase='final';S.done=true;save();timerStop();render()}else{S.i++;S.tab='fb';enterCase()}}
 else if(m==='home'){if(t.dataset.sure){closeOv();S.phase='setup';resumable=S.seq.length>0;save();timerStop();render()}else{t.dataset.sure='1';t.lastChild.textContent='¿Seguro? Haz clic de nuevo (la partida queda guardada para continuar)'}}});
function fs(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}catch(e){}}

/* ── KEYS ── */
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;const k=e.key.toLowerCase();
 if(k==='escape'){closeOv();return}
 if(ov.classList.contains('show'))return;
 if(k===' '||k==='enter'||k==='arrowright'){if(S.phase==='setup')return;e.preventDefault();if(S.phase==='lobby'){S.lobby=false;enterCase();return}next();return}
 if(S.phase==='setup')return;
 if(k==='h'&&S.phase==='case')toggleHint();else if(k==='m')openBoard();else if(k==='q')openQR();else if(k==='f')fs();else if(k==='p')timerToggle();else if(k==='r'&&S.phase==='case'&&!S.revealed)timerStart()});

/* resume: always land on setup with a "continuar" option */
resumable=S.seq.length>0&&S.i<S.seq.length;S.phase='setup';
render();
})();
</script>
</body>
</html>
